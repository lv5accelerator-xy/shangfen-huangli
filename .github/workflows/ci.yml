name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runtime syntax
        run: |
          node --check calendar.js
          node --check app.js
          node --check extras.js
          node --check ai-fortune.js
          node --check onboarding.js
      - name: Run all tests
        run: node --test tests/*.test.cjs
